name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Building needs the macOS 26 SDK (Liquid Glass APIs), so Xcode 26 or later; Package.swift's tools
    # version stops older ones. The app itself runs on macOS 14+.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The runner image's default Xcode; printed so a failure can be traced to the version that built it.
      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved') }}
      - name: Build the package
        run: swift build
      # Into the derived data scripts/check-runtime-warnings.sh builds into, so the check finds it built.
      - name: Build the app
        run: xcodebuild build -project SnapshotKit.xcodeproj -scheme SnapshotKit -derivedDataPath build/DerivedData
      - name: Core tests
        run: swift test --filter SnapshotKitCoreTests
      # Every app test but the pixel comparisons. AppSnapshotTests run locally: their references are rendered
      # on the recording machine's macOS (27) and Retina display, and CI's macOS 26 draws controls differently.
      # AccessibilityTests run here too (the runner is a trusted AX client); they skip themselves where not.
      - name: App tests
        run: swift test --filter SnapshotKitAppTests --skip AppSnapshotTests
      # SwiftUI and AppKit report problems such as "Publishing changes from within view updates"
      # only at run time, to the system log; tests can't see them. Show every screen and fail on any.
      - name: No runtime warnings
        run: scripts/check-runtime-warnings.sh
      - name: Keep the runtime-warning log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-warnings
          path: |
            ${{ runner.temp }}/snapkit-runtime-check.*/*.log
            ${{ runner.temp }}/snapkit-runtime-check.*/*.out
            ${{ runner.temp }}/snapkit-runtime-check.*/*.png
          if-no-files-found: ignore
