name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/pages.yml"]
  # Builds without deploying, so a broken link fails before it is merged.
  pull_request:
    paths: ["site/**", "docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Whole runs queue in push order, and a newer push replaces one still waiting, so the last push is the one
# deployed. (A group on the deploy job alone let an older run's deploy, queued after a newer one's, win.)
# A started run finishes. Pull requests only build, each in its own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # The landing page at the root, the documentation (docs/, Zensical) under /docs/. The screenshots live
      # once, in docs/images; the landing page uses them from images/ as well. Zensical has no --site-dir; it
      # builds to mkdocs.yml's site_dir.
      - name: Build the website and the documentation
        run: |
          zensical build --strict
          mkdir -p _site
          cp -R build/docs-site _site/docs
          cp -R site/. _site/
          cp docs/images/* _site/images/
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
