name: Release

# Pushing a tag such as v0.2.0 builds the app and the CLI and publishes them as a GitHub release, with the
# tag's CHANGELOG.md section as its notes. Releases are named alpha for now ("SnapshotKit 0.4.0 alpha"), but not
# marked as pre-releases: GitHub's releases/latest, which every Download link opens, skips those.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Keep a Changelog headings: "## [0.2.0] - 2026-11-02".
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      # The app as SnapshotKit.xcodeproj builds it (Release, ad-hoc signed), and the CLI.
      - name: Build
        run: |
          xcodebuild archive -project SnapshotKit.xcodeproj -scheme SnapshotKit \
            -archivePath "$RUNNER_TEMP/SnapshotKit.xcarchive"
          swift build -c release --product snapkit
          mkdir dist
          cp -R "$RUNNER_TEMP/SnapshotKit.xcarchive/Products/Applications/SnapshotKit.app" dist/
          cp "$(swift build -c release --show-bin-path)/snapkit" dist/
      - name: Check the tag matches the version built
        run: |
          app="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/SnapshotKit.app/Contents/Info.plist)"
          cli="$(dist/snapkit --version)"
          if [ "$app" != "${GITHUB_REF_NAME#v}" ] || [ "$cli" != "snapkit ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::$GITHUB_REF_NAME, but the app is $app and the CLI says '$cli': update MARKETING_VERSION in SnapshotKit.xcodeproj and SnapshotKitVersion.current"
            exit 1
          fi
      - name: Archives and checksums
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --norsrc --noextattr --noqtn --keepParent SnapshotKit.app "SnapshotKit-$version-macos-arm64.zip"
          ditto -c -k --norsrc --noextattr --noqtn snapkit "snapkit-$version-macos-arm64.zip"
          shasum -a 256 *.zip | tee SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag \
            --title "SnapshotKit ${GITHUB_REF_NAME#v} alpha" --notes-file "$RUNNER_TEMP/notes.md"
