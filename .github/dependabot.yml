version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # requirements-docs.txt pins the whole resolved set; one pull request updates it together.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
